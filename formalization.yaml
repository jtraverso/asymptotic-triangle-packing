  scope: >-
    Proved for every finite vertex type: statement (1) for every uniformity r ≥ 2 and every
    β > 0; statements (2) and (3) for every ε > 0, uniformly over all finite simple graphs with
    decidable adjacency on at least n₀(ε) vertices.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

