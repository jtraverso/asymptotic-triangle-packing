version: "v0.4"

project:
  name: "Near-regular hypergraph matchings and the asymptotic triangle-packing gap"
  description: >-
    A Lean 4 / Mathlib formalization of three results. (1) A finite nibble theorem: r-uniform
    hypergraphs whose degrees are at most (1+μ)d everywhere and at least (1−μ)d outside an
    exceptional set of at most η|V| vertices, with codegrees at most μd, have matchings with at
    least (1−β)|V|/r edges. (2) The fractional–integral triangle-packing gap is o(n²) uniformly
    over finite graphs: every large graph has an edge-disjoint triangle family P such that every
    fractional triangle packing has weight at most |P| + εn² (the triangle case of Haxell–Rödl).
    (3) The cover form: a fractional triangle cover of weight at most |P| + εn² exists. The proof
    combines a nibble with second-moment and Freedman-type concentration, a low-degree core
    reduction, Mathlib's Szemerédi regularity lemma with a cluster linear program rounded by
    explicit designs, and LP duality.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

