    The results and the route were chosen by the human author; the Lean proofs are AI-generated
    and mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and
    Quot.sound, identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Statement (1) is a variant of the classical nibble theorem: low degrees are allowed on an
    exceptional set of at most η|V| vertices, but the upper bound (1+μ)d is required at every
    vertex; the conclusion counts matching edges against |V|/r. Statements (2) and (3) are given
    existentially instead of through optimum values: instead of ν*(G) − ν(G) ≤ εn² (resp.
    τ*(G) − ν(G) ≤ εn²) they assert an edge-disjoint triangle family P with every fractional
    packing of weight at most |P| + εn² (resp. some fractional cover of weight at most
    |P| + εn²), which is equivalent. Triangles are the 3-cliques of G; two triangles are
    edge-disjoint when they share at most one vertex; fractional packings put nonnegative
    weights on vertex sets, only weights of triangles enter the sums, and every edge receives
    total weight at most one; fractional covers put nonnegative weights on unordered pairs, and
    every triangle receives total weight at least one from the edges of G inside it.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification. The agent
    compared the Challenge statements with the classical results (Haxell–Rödl for triangles;
    the Frankl–Rödl / Pippenger–Spencer nibble) and recorded the differences above. It checked
    that the vendored modules are the merged Lean Pool sources up to the normalized header lines.
    It wrote and checked the bridges in Solution.lean (realization of ν₃ by an edge-disjoint
    family, approximation of the infimum τ₃*, weak duality), and confirmed by `lake build`,
    `#print axioms` and a comparison of the fully elaborated Challenge and Solution types that
    the proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The author
    directed the work and approved the statements. No independent human mathematical review has
    been performed. Statements (2) and (3) are known results (Haxell–Rödl); the nibble variant
    (1) is stated in the form used by the author's Paper III.

