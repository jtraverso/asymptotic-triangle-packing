      lean: "AsymptoticTrianglePacking.near_regular_nibble"
      module: "Challenge"
      status: "proved"
      note: "Near-regular uniform hypergraphs with small codegrees have near-perfect matchings."
    - source: "Haxell–Rödl (2001), main theorem, F = K3"
      lean: "AsymptoticTrianglePacking.fractional_triangle_packing_gap"
      module: "Challenge"
      status: "proved"
      note: "ν*(G) − ν(G) = o(n²) for triangles, uniformly over finite graphs."
    - source: "Haxell–Rödl (2001) with LP duality, cover form"
